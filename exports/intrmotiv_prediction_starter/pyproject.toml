[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "intrmotiv-prediction-starter"
version = "0.1.0"
description = "Selected IntrMotiv prediction components and tested handoff adapters"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["intrmotiv_transfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

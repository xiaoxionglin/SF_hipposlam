name: pre-commit

on: [push, pull_request]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.10"
    - name: Install pre-commit
      run: python -m pip install pre-commit==4.6.2
    - name: Run pre-commit
      run: pre-commit run --all-files

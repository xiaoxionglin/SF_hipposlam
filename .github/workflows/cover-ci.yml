name: coverage

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  run-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
    - name: Install project and coverage dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -e '.[onnx]' pytest==7.4.4 pytest-cov
    - name: Generate Sample Factory coverage report
      run: |
        python -m pytest --cov=sample_factory --cov-config=.core-coveragerc --cov-report=xml -q \
          tests/algo \
          tests/envs/tuple_action_envs \
          tests/examples \
          tests/test_launcher.py \
          tests/test_utils.py \
          --ignore=tests/algo/test_model.py \
          -k "not torch_tensor_share"
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        verbose: true

name: tests

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
    - name: Install project and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -e '.[onnx,analysis]' pytest==7.4.4 wheel
    - name: Verify installed wheel outside the checkout
      run: |
        python setup.py bdist_wheel
        python scripts/check_wheel_install.py dist/sample_factory-*.whl
    - name: Run compatibility pre-checks
      run: python -m pytest -q tests/test_precheck.py tests/algo/test_pbt.py
    - name: Run portable Sample Factory tests
      run: |
        python -m pytest -q \
          tests/algo \
          tests/envs/tuple_action_envs \
          tests/examples \
          tests/test_launcher.py \
          tests/test_utils.py \
          --ignore=tests/algo/test_model.py \
          --ignore=tests/algo/test_pbt.py \
          -k "not torch_tensor_share"
    - name: Run declarative IntrMotiv workflow tests
      run: python -m pytest -q hpc_runs/test_*.py
    - name: Run portable shared-component and SimGaY tests
      run: python -m pytest -q tests/test_shared_dg.py tests/test_simgay_*.py tests/test_frozen_exports.py
